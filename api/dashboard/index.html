<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Geo-AI Dashboard</title>
    <link rel="stylesheet" href="styles/tokens.css">
    <link rel="stylesheet" href="styles/layout.css">
    <link rel="stylesheet" href="styles/analytics.css">
    <link rel="stylesheet" href="styles/eval.css">
    <link rel="stylesheet" href="styles/prompt-lab.css">
    <link rel="stylesheet" href="styles/retrieval.css">
    <link rel="stylesheet" href="styles/trace.css">
</head>
<body>
    <p id="boot-error" class="empty err" role="alert" hidden></p>

    <!--
        Vue compiles the markup inside #app in the browser, so it has to stay valid HTML (no self-closing tags).
        Questions, titles, labels, answers and source paths come from public chat users or from the model, so
        render them only through {{ }} or a :attribute binding, which escape their values. Never use v-html in
        this template.
        Each view's state lives in a namespace: `analytics.*`, `eval.*`, `promptLab.*`, `retrieval.*` and `trace.*`. Only the shared
        formatting helpers and the sign-in state are top-level names.
    -->
    <div id="app" v-cloak>
        <template v-if="!authenticated">
            <header>
                <h1>Geo-AI Dashboard</h1>
                <form class="auth" @submit.prevent="connect">
                    <input type="password" v-model="tokenInput" placeholder="Admin token" autocomplete="off" aria-label="Admin token">
                    <button type="submit" class="btn">Connect</button>
                </form>
            </header>
            <p class="empty err" role="alert" v-if="authError">{{ authError }}</p>
        </template>

        <template v-else>
            <header>
                <h1>Geo-AI Dashboard</h1>
                <div class="auth">
                    <button type="button" class="btn" @click="disconnect()">Disconnect</button>
                </div>
            </header>

            <nav class="tabs" aria-label="Dashboard sections">
                <button type="button" class="tab" :class="{ on: tab === 'analytics' }" :aria-pressed="tab === 'analytics'" @click="tab = 'analytics'">Analytics</button>
                <button type="button" class="tab" :class="{ on: tab === 'eval' }" :aria-pressed="tab === 'eval'" @click="tab = 'eval'">Evaluation</button>
                <button type="button" class="tab" :class="{ on: tab === 'prompt-lab' }" :aria-pressed="tab === 'prompt-lab'" @click="tab = 'prompt-lab'">Prompt Lab</button>
                <button type="button" class="tab" :class="{ on: tab === 'retrieval' }" :aria-pressed="tab === 'retrieval'" @click="tab = 'retrieval'">Retrieval Inspector</button>
                <button type="button" class="tab" :class="{ on: tab === 'trace' }" :aria-pressed="tab === 'trace'" @click="tab = 'trace'">Pipeline Trace</button>
            </nav>

            <div v-show="tab === 'analytics'">
                <div class="subline" :class="{ err: analytics.errors.overview }">{{ analytics.sublineText }}</div>
                <div class="config-line" v-if="analytics.config">Active: {{ analytics.config.retrieval_strategy }} · k={{ analytics.config.retrieval_top_k }} · {{ analytics.config.reranker_provider }}<template v-if="analytics.config.llm_model"> · {{ analytics.config.llm_model }}</template></div>

                <div class="metrics">
                    <div class="metric" v-for="m in analytics.metrics" :key="m.label">
                        <div class="metric-val">{{ m.value }}</div>
                        <div class="metric-lbl">{{ m.label }}</div>
                    </div>
                </div>

                <section class="panel">
                    <div class="panel-head">
                        <h2>Daily usage</h2>
                        <div class="toggle" role="group" aria-label="Date range">
                            <button type="button" v-for="n in analytics.rangeOptions" :key="n" :class="{ on: analytics.days === n }" :aria-pressed="analytics.days === n" @click="analytics.setDays(n)">{{ n }}d</button>
                        </div>
                    </div>
                    <div class="chart-box" v-show="analytics.hasDaily">
                        <canvas id="dailyChart" ref="dailyCanvas" role="img" aria-label="Line chart of daily queries, thumbs up and thumbs down"></canvas>
                    </div>
                    <p class="empty" :class="{ err: analytics.errors.daily }" v-if="analytics.messages.daily">{{ analytics.messages.daily }}</p>
                </section>

                <section class="panel">
                    <div class="cols">
                        <div>
                            <div class="panel-head">
                                <h2>Top cited sources <span class="ct" v-if="analytics.citations && analytics.citations.length">({{ analytics.citations.length }})</span></h2>
                            </div>
                            <div class="tbl-scroll" role="region" aria-label="Top cited sources" tabindex="0" v-if="analytics.citations && analytics.citations.length">
                                <table>
                                    <thead>
                                        <tr>
                                            <th scope="col">Source</th>
                                            <th scope="col" class="bar-col" aria-label="Share of the most cited source"></th>
                                            <th scope="col" class="num">Cites</th>
                                            <th scope="col" class="num">Satisfaction</th>
                                            <th scope="col" class="nowrap">Last cited</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr v-for="c in analytics.citations" :key="c.source_path + '|' + c.display_label">
                                            <td><div class="src-col" :title="c.source_path">{{ c.display_label || c.source_path }}</div></td>
                                            <td class="bar-col"><div class="bar-track" aria-hidden="true"><div class="bar-fill" :style="{ width: analytics.barWidth(c.cite_count) }"></div></div></td>
                                            <td class="num mono">{{ c.cite_count }}</td>
                                            <td class="num"><span class="sat" :class="satClass(c.thumbs_up_pct)">{{ formatSatisfaction(c.thumbs_up_pct) }}</span></td>
                                            <td class="sub nowrap">{{ formatDate(c.last_cited_at) }}</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                            <p class="empty" :class="{ err: analytics.errors.citations }" v-if="analytics.messages.citations">{{ analytics.messages.citations }}</p>
                        </div>

                        <div>
                            <div class="panel-head">
                                <h2>Retrieval gaps <span class="ct" v-if="analytics.gaps && analytics.gaps.length">({{ analytics.gaps.length }})</span></h2>
                            </div>
                            <div class="tbl-scroll" role="region" aria-label="Retrieval gaps" tabindex="0" v-if="analytics.gaps && analytics.gaps.length">
                                <table>
                                    <thead>
                                        <tr>
                                            <th scope="col">Question</th>
                                            <th scope="col">Top score</th>
                                            <th scope="col">Method</th>
                                            <th scope="col" class="num" title="Thumbs-down count">Dn</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr v-for="g in analytics.gaps" :key="g.question">
                                            <td><div class="q-col" :title="g.question">{{ g.question }}</div></td>
                                            <td><span class="mono" :class="scoreClass(g.avg_top_score)">{{ formatScore(g.avg_top_score) }}</span></td>
                                            <td class="sub">{{ g.ranking_methods || '-' }}</td>
                                            <td class="num mono">{{ g.thumbs_down_count }}</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                            <p class="empty" :class="{ err: analytics.errors.gaps }" v-if="analytics.messages.gaps">{{ analytics.messages.gaps }}</p>
                        </div>
                    </div>
                </section>

                <section class="panel">
                    <div class="panel-head">
                        <h2>Recent conversations <span class="ct" v-if="analytics.conversations && analytics.conversations.length">({{ analytics.conversations.length }})</span></h2>
                    </div>
                    <div class="tbl-scroll" role="region" aria-label="Recent conversations" tabindex="0" v-if="analytics.conversations && analytics.conversations.length">
                        <table>
                            <thead>
                                <tr>
                                    <th scope="col">Conversation</th>
                                    <th scope="col">Turns</th>
                                    <th scope="col">Visitor</th>
                                    <th scope="col">Duration</th>
                                    <th scope="col">Started</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr v-for="c in analytics.conversations" :key="c.id">
                                    <td><div class="title-col" :class="{ untitled: !conversationTitle(c) }" :title="c.id">{{ conversationTitle(c) || 'Untitled' }}</div></td>
                                    <td class="mono">{{ c.interaction_count }}</td>
                                    <td class="vid" :title="c.visitor_id">{{ shortId(c.visitor_id) }}</td>
                                    <td class="mono sub">{{ formatDuration(c.duration_seconds) }}</td>
                                    <td class="sub nowrap">{{ formatDate(c.created_at) }}</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <p class="empty" :class="{ err: analytics.errors.conversations }" v-if="analytics.messages.conversations">{{ analytics.messages.conversations }}</p>
                </section>
            </div>

            <div v-show="tab === 'eval'">
                <div class="eval-bar">
                    <div class="eval-runs">
                        <label class="eval-field" v-if="eval.runs && eval.runs.length">
                            <span>Run</span>
                            <select v-model="eval.selectedRunId">
                                <option v-for="r in eval.runs" :key="r.eval_run_id" :value="r.eval_run_id">{{ eval.runLabel(r) }}</option>
                            </select>
                        </label>
                        <button type="button" class="eval-refresh" title="Refresh runs" aria-label="Refresh runs" @click="eval.fetchAll()">&#x21BB;</button>
                        <button type="button" class="eval-refresh" title="Download CSV" aria-label="Download CSV" @click="eval.downloadCsv()" :disabled="!eval.selectedRunId">&#x2913;</button>
                        <button type="button" class="eval-refresh btn-success" title="Resume run" aria-label="Resume run" @click="eval.resumeRun()" v-if="eval.selectedRun && (eval.selectedRun.status === 'failed' || eval.selectedRun.status === 'cancelled')">&#x25B6;</button>
                        <button type="button" class="eval-refresh btn-danger-outline" title="Cancel run" aria-label="Cancel run" @click="eval.cancelRun()" v-if="eval.selectedRun && (eval.selectedRun.status === 'running' || eval.selectedRun.status === 'pending')">&#x2716;</button>
                    </div>
                    <div class="eval-controls">
                        <label class="eval-field" v-if="eval.sets && eval.sets.length">
                            <span>Eval set</span>
                            <select v-model="eval.selectedSetName" :disabled="eval.busy">
                                <option v-for="s in eval.sets" :key="s.id" :value="s.name">{{ eval.setLabel(s) }}</option>
                            </select>
                        </label>
                        <div class="eval-field eval-question">
                            <span class="eval-question-label">Questions <span class="eval-hint">(none = all)</span></span>
                            <div class="eval-checkbox-list" :class="{ disabled: eval.busy }">
                                <label v-for="q in eval.questions" :key="q.question_key" class="eval-checkbox-item">
                                    <input type="checkbox" :value="q.question_key" v-model="eval.selectedQuestionIds" :disabled="eval.busy">
                                    <span>{{ q.question_key }} - {{ q.question }}</span>
                                </label>
                                <span v-if="!eval.questions || eval.questions.length === 0" class="eval-hint">No questions loaded</span>
                            </div>
                        </div>
                        <button type="button" class="btn btn-primary" :disabled="eval.busy || !eval.selectedSetName" @click="eval.startRun(eval.selectedSetName, null, eval.selectedQuestionIds)">{{ eval.busy ? 'Running...' : 'Run Evaluation' }}</button>
                    </div>
                </div>
                <p class="empty err" role="alert" v-if="eval.errors.run">{{ eval.errors.run }}</p>
                <p class="empty err" v-if="eval.errors.questions">{{ eval.errors.questions }}</p>
                <p class="empty" :class="{ err: eval.errors.sets }" v-if="eval.messages.sets">{{ eval.messages.sets }}</p>
                <p class="empty" :class="{ err: eval.errors.runs }" v-if="eval.messages.runs">{{ eval.messages.runs }}</p>

                <div class="subline" :class="{ err: eval.statusFailed }" v-if="eval.runDetail">{{ eval.statusLine }}</div>

                <div class="metrics eval-metrics" v-if="eval.runDetail">
                    <div class="metric" v-for="m in eval.metrics" :key="m.label">
                        <div class="metric-val">{{ m.value }}</div>
                        <div class="metric-lbl">{{ m.label }}</div>
                    </div>
                </div>

                <div class="eval-sparklines" v-if="eval.sparklineVisible">
                    <h3>Score Trends</h3>
                    <div class="sparkline-grid">
                        <div class="sparkline-item" v-for="(label, i) in ['Precision', 'NDCG', 'Similarity', 'Faithfulness']" :key="i">
                            <span class="sparkline-label">{{ label }}</span>
                            <canvas :id="'sparkline-' + i" height="40"></canvas>
                        </div>
                    </div>
                    <div class="eval-regression-warning" v-if="eval.regressions && eval.regressions.length">
                        &#x26A0; Score regression: <span v-for="r in eval.regressions" :key="r.metric">{{ r.metric }} dropped {{ r.drop }} </span>
                    </div>
                </div>

                <section class="panel" v-if="eval.runDetail || eval.messages.detail">
                    <div class="panel-head" v-if="eval.runDetail">
                        <h2>Results <span class="ct">({{ eval.rows.length }})</span></h2>
                    </div>
                    <div class="tbl-scroll" role="region" aria-label="Evaluation results" tabindex="0" v-if="eval.rows.length">
                        <table>
                            <thead>
                                <tr>
                                    <th scope="col">ID</th>
                                    <th scope="col">Question</th>
                                    <th scope="col" class="num" v-for="col in eval.scoreColumns" :key="col.key" :title="col.hint">{{ col.label }}</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template v-for="row in eval.rows" :key="row.key">
                                    <tr class="eval-row" :class="{ open: eval.isExpanded(row.key) }" @click="eval.toggleExpand(row.key)">
                                        <td class="mono" style="font-size:11px;white-space:nowrap;color:var(--tx2)">{{ row.key }}</td>
                                        <td>
                                            <button type="button" class="eval-toggle" :aria-expanded="eval.isExpanded(row.key)" :title="row.question">
                                                <span class="eval-q">{{ row.question }}</span>
                                            </button>
                                        </td>
                                        <td class="num mono" v-for="col in eval.scoreColumns" :key="col.key" :class="evalScoreClass(row.scores[col.key])">{{ formatScore(row.scores[col.key]) }}</td>
                                    </tr>
                                    <tr class="eval-detail" v-if="eval.isExpanded(row.key)">
                                        <td :colspan="eval.scoreColumns.length + 2">
                                            <div class="eval-panel">
                                                <div class="eval-block">
                                                    <div class="eval-lbl">Answer</div>
                                                    <div class="eval-text" v-if="row.response">{{ row.response }}</div>
                                                    <div class="sub" v-else>No answer was recorded.</div>
                                                </div>
                                                <div class="eval-block" v-if="row.expectedAnswer">
                                                    <div class="eval-lbl">Expected answer</div>
                                                    <div class="eval-text">{{ row.expectedAnswer }}</div>
                                                </div>
                                                <div class="eval-block">
                                                    <div class="eval-lbl">Retrieved sources ({{ row.chunks.length }})</div>
                                                    <table class="eval-chunks" v-if="row.chunks.length">
                                                        <thead>
                                                            <tr>
                                                                <th scope="col">Source</th>
                                                                <th scope="col" class="num">Score</th>
                                                                <th scope="col">Method</th>
                                                            </tr>
                                                        </thead>
                                                        <tbody>
                                                            <tr v-for="(chunk, i) in row.chunks" :key="i">
                                                                <td class="mono">{{ chunk.source_path || '-' }}</td>
                                                                <td class="num mono">{{ formatScore(chunk.score) }}</td>
                                                                <td class="sub">{{ chunk.ranking_method || '-' }}</td>
                                                            </tr>
                                                        </tbody>
                                                    </table>
                                                    <div class="sub" v-else>No chunks were recorded.</div>
                                                </div>
                                            </div>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                    <p class="empty" :class="{ err: eval.errors.detail }" v-if="eval.messages.detail">{{ eval.messages.detail }}</p>
                </section>
            </div>

            <div v-show="tab === 'prompt-lab'">
                <div class="prompt-lab">
                    <div class="prompt-editor">
                        <h2>System Prompt</h2>
                        <div v-if="promptLab.activePrompt" class="prompt-active-info">
                            Active: #{{ promptLab.activePrompt.id }} · {{ promptLab.activePrompt.hash.slice(0, 12) }}<span v-if="promptLab.activePrompt.label"> · {{ promptLab.activePrompt.label }}</span>
                        </div>
                        <textarea v-model="promptLab.editorContent" rows="12" spellcheck="false"></textarea>
                        <div class="prompt-editor-actions">
                            <input type="text" v-model="promptLab.labelInput" placeholder="Label this version..." class="prompt-label-input">
                            <button type="button" class="eval-btn btn-primary" @click="promptLab.save()" :disabled="promptLab.saving">Save</button>
                        </div>
                    </div>
                    <div class="prompt-test">
                        <h2>Test</h2>
                        <div class="prompt-test-controls">
                            <input type="text" v-model="promptLab.testQuestion" placeholder="Enter a test question..." class="prompt-test-input">
                            <button type="button" class="eval-btn btn-primary" @click="promptLab.test()" :disabled="promptLab.testing || !promptLab.testQuestion">Test</button>
                        </div>
                        <div v-if="promptLab.testResult" class="prompt-test-result">
                            <h3>Answer</h3>
                            <div class="prompt-test-answer">{{ promptLab.testResult.answer }}</div>
                            <h3 v-if="promptLab.testResult.sources && promptLab.testResult.sources.length">Sources</h3>
                            <ul v-if="promptLab.testResult.sources">
                                <li v-for="s in promptLab.testResult.sources" :key="s">{{ s }}</li>
                            </ul>
                        </div>
                        <p v-if="promptLab.error" class="eval-error">{{ promptLab.error }}</p>
                    </div>
                </div>
                <div class="prompt-versions" v-if="promptLab.versions && promptLab.versions.length">
                    <h2>Version History</h2>
                    <div class="tbl-scroll">
                        <table>
                            <thead><tr><th>ID</th><th>Hash</th><th>Label</th><th>Status</th><th>Created</th><th></th></tr></thead>
                            <tbody>
                                <tr v-for="v in promptLab.versions" :key="v.id">
                                    <td class="mono">{{ v.id }}</td>
                                    <td class="mono">{{ v.hash }}</td>
                                    <td>{{ v.label || '-' }}</td>
                                    <td><span v-if="v.is_active" class="prompt-badge-active">Active</span></td>
                                    <td class="sub">{{ new Date(v.created_at).toLocaleString() }}</td>
                                    <td><button v-if="!v.is_active" type="button" class="eval-btn prompt-btn-activate" @click="promptLab.activate(v.id)">Activate</button></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div v-show="tab === 'retrieval'">
                <div class="retrieval-controls">
                    <input type="text" v-model="retrieval.question" placeholder="Enter a question to inspect retrieval..." class="retrieval-input" @keyup.enter="retrieval.inspect()">
                    <input type="text" v-model="retrieval.expectedSources" placeholder="Expected source prefixes (comma-separated)..." class="retrieval-input" style="font-size:11px">
                    <button type="button" class="eval-btn btn-primary" @click="retrieval.inspect()" :disabled="retrieval.loading || !retrieval.question">Inspect</button>
                </div>
                <p v-if="retrieval.error" class="eval-error">{{ retrieval.error }}</p>
                <div v-if="retrieval.results">
                    <div class="retrieval-config">
                        {{ retrieval.results.strategy }} &middot; top_k={{ retrieval.results.top_k }} &middot; rrf_k={{ retrieval.results.rrf_k }} &middot; {{ retrieval.results.reranker }}
                        <span v-if="retrieval.results.precision != null"> &middot; precision={{ retrieval.results.precision.toFixed(3) }}</span>
                        <span v-if="retrieval.results.ndcg != null"> &middot; ndcg={{ retrieval.results.ndcg.toFixed(3) }}</span>
                    </div>
                    <div class="retrieval-stages" v-if="retrieval.results.stages && retrieval.results.stages.length">
                        <table class="retrieval-stages-table">
                            <thead><tr><th>Stage</th><th class="num">Latency</th><th class="num">In</th><th class="num">Out</th></tr></thead>
                            <tbody>
                                <tr v-for="s in retrieval.results.stages" :key="s.stage">
                                    <td>{{ s.stage }}</td>
                                    <td class="num mono">{{ s.latency_ms }}ms</td>
                                    <td class="num mono">{{ s.input_count }}</td>
                                    <td class="num mono">{{ s.output_count }}</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="tbl-scroll">
                        <table>
                            <thead><tr><th>#</th><th>Source</th><th>Text</th><th style="text-align:right">Score</th></tr></thead>
                            <tbody>
                                <tr v-for="c in retrieval.results.chunks" :key="c.rank" :class="{ 'retrieval-match': c.matches_expected }">
                                    <td class="mono">{{ c.rank }}</td>
                                    <td style="font-size:11px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ c.source_path }}</td>
                                    <td class="retrieval-text-cell" @click="retrieval.toggleExpand(c.rank)">
                                        <div v-if="!retrieval.isExpanded(c.rank)" class="retrieval-text-preview">{{ c.textPreview }}</div>
                                        <div v-else class="retrieval-text-full">{{ c.text }}</div>
                                    </td>
                                    <td class="mono" style="text-align:right">{{ c.score.toFixed(3) }}</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div v-show="tab === 'trace'">
                <div class="trace-modes">
                    <button type="button" :class="{ on: trace.mode === 'history' }" @click="trace.mode = 'history'">History</button>
                    <button type="button" :class="{ on: trace.mode === 'live' }" @click="trace.mode = 'live'">Live</button>
                </div>

                <p class="empty err" role="alert" v-if="trace.error">{{ trace.error }}</p>

                <div v-show="trace.mode === 'history'">
                    <div class="trace-list" v-if="trace.interactions.length">
                        <div v-for="item in trace.interactions" :key="item.id"
                             class="trace-list-item" :class="{ selected: trace.selectedId === item.id }"
                             @click="trace.fetchTrace(item.id)">
                            <div class="trace-list-q" :title="item.question">{{ item.question }}</div>
                            <span class="trace-enriched-badge" v-if="item.has_enriched_trace">enriched</span>
                            <span class="trace-list-date">{{ formatDate(item.created_at) }}</span>
                        </div>
                    </div>
                    <p class="empty" v-if="!trace.loading && !trace.error && !trace.interactions.length">No interactions recorded.</p>
                    <div class="trace-pagination" v-if="trace.interactionsTotal > 20">
                        <button type="button" class="eval-btn" :disabled="trace.interactionsPage === 0" @click="trace.fetchInteractions(trace.interactionsPage - 20)">Prev</button>
                        <span>{{ trace.interactionsPage + 1 }}-{{ Math.min(trace.interactionsPage + 20, trace.interactionsTotal) }} of {{ trace.interactionsTotal }}</span>
                        <button type="button" class="eval-btn" :disabled="trace.interactionsPage + 20 >= trace.interactionsTotal" @click="trace.fetchInteractions(trace.interactionsPage + 20)">Next</button>
                    </div>
                </div>

                <div v-show="trace.mode === 'live'">
                    <div class="trace-live-controls">
                        <input type="text" v-model="trace.liveQuestion" placeholder="Enter a question to trace..." class="trace-live-input" @keyup.enter="trace.runLiveTrace()">
                        <button type="button" class="eval-btn btn-primary" @click="trace.runLiveTrace()" :disabled="trace.loading || !trace.liveQuestion">{{ trace.loading ? 'Running...' : 'Run Trace' }}</button>
                    </div>
                </div>

                <p class="empty" v-if="trace.loading">Loading...</p>

                <div v-if="trace.hasTrace" class="trace-detail">
                    <div class="trace-interaction-header" v-if="trace.mode === 'history' && trace.traceDetail">
                        {{ formatDate(trace.traceDetail.interaction.created_at) }}
                        <template v-if="trace.traceDetail.interaction.latency_ms != null"> &middot; {{ formatLatency(trace.traceDetail.interaction.latency_ms) }}</template>
                        <template v-if="trace.traceDetail.interaction.token_count != null"> &middot; {{ trace.traceDetail.interaction.token_count }} tokens</template>
                        <span class="trace-enriched-badge" v-if="trace.traceDetail.has_enriched_trace" style="margin-left:6px">enriched</span>
                    </div>

                    <div class="trace-stage" :class="{ open: trace.isStageExpanded('input') }">
                        <div class="trace-stage-header" @click="trace.toggleStage('input')">
                            <span>Input</span>
                        </div>
                        <div class="trace-stage-body" v-show="trace.isStageExpanded('input')">
                            <div><strong>Question:</strong> {{ trace.activeQuestion }}</div>
                            <div v-if="trace.activeTrace.context && trace.activeTrace.context.history_turns != null"><strong>History turns:</strong> {{ trace.activeTrace.context.history_turns }}</div>
                        </div>
                    </div>

                    <div class="trace-stage" :class="{ open: trace.isStageExpanded('retrieval') }">
                        <div class="trace-stage-header" @click="trace.toggleStage('retrieval')">
                            <span>Retrieval</span>
                            <span class="trace-stage-latency" v-if="trace.activeTrace.retrieval && trace.activeTrace.retrieval.total_latency_ms != null">{{ trace.activeTrace.retrieval.total_latency_ms }}ms</span>
                        </div>
                        <div class="trace-stage-body" v-show="trace.isStageExpanded('retrieval')">
                            <template v-if="trace.activeTrace.retrieval">
                                <table v-if="trace.activeTrace.retrieval.stages && trace.activeTrace.retrieval.stages.length" class="trace-stages-table">
                                    <thead><tr><th>Stage</th><th class="num">Latency</th><th class="num">In</th><th class="num">Out</th></tr></thead>
                                    <tbody>
                                        <tr v-for="s in trace.activeTrace.retrieval.stages" :key="s.stage">
                                            <td>{{ s.stage }}</td>
                                            <td class="num mono">{{ s.latency_ms }}ms</td>
                                            <td class="num mono">{{ s.input_count }}</td>
                                            <td class="num mono">{{ s.output_count }}</td>
                                        </tr>
                                    </tbody>
                                </table>
                                <div v-else><strong>Chunks:</strong> {{ trace.activeTrace.retrieval.chunk_count || '-' }}</div>
                                <div v-if="trace.activeTrace.retrieval.retrieval_query"><strong>Query:</strong> {{ trace.activeTrace.retrieval.retrieval_query }}</div>
                            </template>
                            <div class="sub" v-else>No retrieval data.</div>
                        </div>
                    </div>

                    <div class="trace-stage" :class="{ open: trace.isStageExpanded('context') }">
                        <div class="trace-stage-header" @click="trace.toggleStage('context')">
                            <span>Context Assembly</span>
                        </div>
                        <div class="trace-stage-body" v-show="trace.isStageExpanded('context')">
                            <template v-if="trace.activeTrace.context">
                                <div v-if="trace.activeTrace.context.system_prompt_id != null"><strong>System prompt:</strong> #{{ trace.activeTrace.context.system_prompt_id }}</div>
                                <div><strong>Chunks:</strong> {{ trace.activeTrace.context.chunk_count != null ? trace.activeTrace.context.chunk_count : '-' }}</div>
                                <div><strong>History turns:</strong> {{ trace.activeTrace.context.history_turns != null ? trace.activeTrace.context.history_turns : '-' }}</div>
                                <template v-if="trace.activeTrace.context.messages && trace.activeTrace.context.messages.length">
                                    <button type="button" class="trace-messages-toggle" @click="trace.messagesExpanded = !trace.messagesExpanded">{{ trace.messagesExpanded ? 'Hide' : 'Show' }} messages ({{ trace.activeTrace.context.messages.length }})</button>
                                    <div v-if="trace.messagesExpanded">
                                        <div v-for="(msg, mi) in trace.activeTrace.context.messages" :key="mi" class="trace-message">
                                            <span class="trace-message-role">{{ msg.role }}</span> {{ typeof msg.content === 'string' ? (msg.content.length > 300 ? msg.content.slice(0, 300) + '...' : msg.content) : '[structured]' }}
                                        </div>
                                    </div>
                                </template>
                            </template>
                            <div class="sub" v-else>No context data.</div>
                        </div>
                    </div>

                    <div class="trace-stage" :class="{ open: trace.isStageExpanded('generation') }">
                        <div class="trace-stage-header" @click="trace.toggleStage('generation')">
                            <span>Generation</span>
                            <span class="trace-stage-latency" v-if="trace.activeTrace.generation && trace.activeTrace.generation.generation_ms != null">{{ trace.activeTrace.generation.generation_ms }}ms</span>
                        </div>
                        <div class="trace-stage-body" v-show="trace.isStageExpanded('generation')">
                            <template v-if="trace.activeTrace.generation">
                                <div v-if="trace.activeTrace.generation.model"><strong>Model:</strong> {{ trace.activeTrace.generation.model }}</div>
                                <div v-if="trace.activeTrace.generation.prompt_tokens != null"><strong>Prompt tokens:</strong> {{ trace.activeTrace.generation.prompt_tokens }}</div>
                                <div v-if="trace.activeTrace.generation.completion_tokens != null"><strong>Completion tokens:</strong> {{ trace.activeTrace.generation.completion_tokens }}</div>
                                <div v-if="trace.activeTrace.generation.reasoning_tokens != null"><strong>Reasoning tokens:</strong> {{ trace.activeTrace.generation.reasoning_tokens }}</div>
                                <div v-if="trace.activeTrace.generation.finish_reason"><strong>Finish reason:</strong> {{ trace.activeTrace.generation.finish_reason }}</div>
                                <div v-if="trace.activeTrace.generation.token_event_count != null"><strong>Token events:</strong> {{ trace.activeTrace.generation.token_event_count }}</div>
                                <div v-if="trace.activeTrace.generation.reasoning_content">
                                    <strong>Reasoning:</strong>
                                    <div class="trace-reasoning-text">{{ trace.activeTrace.generation.reasoning_content }}</div>
                                </div>
                            </template>
                            <div class="sub" v-else>No generation data.</div>
                        </div>
                    </div>

                    <div class="trace-stage" :class="{ open: trace.isStageExpanded('response') }">
                        <div class="trace-stage-header" @click="trace.toggleStage('response')">
                            <span>Response</span>
                        </div>
                        <div class="trace-stage-body" v-show="trace.isStageExpanded('response')">
                            <div class="trace-response-text" v-if="trace.activeResponse">{{ trace.activeResponse }}</div>
                            <div class="sub" v-else>No response.</div>
                        </div>
                    </div>

                    <div class="trace-stage" :class="{ open: trace.isStageExpanded('citations') }">
                        <div class="trace-stage-header" @click="trace.toggleStage('citations')">
                            <span>Citations ({{ trace.activeCitations.length }})</span>
                        </div>
                        <div class="trace-stage-body" v-show="trace.isStageExpanded('citations')">
                            <table v-if="trace.activeCitations.length" class="trace-citations-table">
                                <thead><tr><th>#</th><th>Source</th><th class="num">Score</th><th>Method</th></tr></thead>
                                <tbody>
                                    <tr v-for="cit in trace.activeCitations" :key="cit.citation_index">
                                        <td class="mono">{{ cit.citation_index }}</td>
                                        <td style="font-size:11px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ cit.source_path }}</td>
                                        <td class="num mono">{{ formatScore(cit.score) }}</td>
                                        <td class="sub">{{ cit.ranking_method || '-' }}</td>
                                    </tr>
                                </tbody>
                            </table>
                            <div class="sub" v-else>No citations.</div>
                        </div>
                    </div>

                    <div class="trace-groundedness">
                        <button type="button" class="eval-btn groundedness-btn" @click="trace.checkGroundedness()" :disabled="trace.groundednessLoading || !trace.canCheckGroundedness">{{ trace.groundednessLoading ? 'Checking...' : 'Check Groundedness' }}</button>
                        <div v-if="trace.groundednessResult">
                            <div class="groundedness-summary">
                                <span class="mono">{{ trace.groundednessResult.summary.supported }}/{{ trace.groundednessResult.summary.total_claims }}</span> claims supported
                                <span class="mono" :class="evalScoreClass(trace.groundednessResult.summary.score)">({{ (trace.groundednessResult.summary.score * 100).toFixed(0) }}%)</span>
                            </div>
                            <div v-for="(claim, ci) in trace.groundednessResult.claims" :key="ci" class="claim" :class="claim.verdict">
                                <div class="claim-verdict"><span class="claim-badge" :class="claim.verdict">{{ claim.verdict }}</span></div>
                                <div class="claim-text">{{ claim.claim }}</div>
                                <div class="claim-detail sub" v-if="claim.evidence">Evidence: {{ claim.evidence }}</div>
                                <div class="claim-detail sub" v-if="claim.explanation">{{ claim.explanation }}</div>
                                <div class="claim-detail sub" v-if="claim.source_path">Source: {{ claim.source_path }}</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </template>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.5.43/vue.global.prod.min.js" integrity="sha512-ex6QSF8dE/wQIo4mJArcGAx/m1E8T4hwkI/ecL/6AZhTcWDGaKXCSRrcHEzOeTnp0BHo5/kyg7g1ltVnTDwktQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.1/chart.umd.min.js" integrity="sha512-WoViKhKD4qI2WruSZqv9+kvM4WfFhUMQCLN4QlDTt5aU56fLQy2gYoxWIqlEnXqJy/+Ac5q/hk1oWfqnMDhwMA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
